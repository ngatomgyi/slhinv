  <path d="M 0 52 L 0 0 L 52 0" stroke="#e5c378" stroke-width="1.5" stroke-linecap="square" opacity="0.95" />
  <!-- Inner parallel hairline -->
  <path d="M 4 42 L 4 4 L 42 4" stroke="#e5c378" stroke-width="0.75" stroke-linecap="square" opacity="0.65" />
  <!-- Auspicious Ruyi / Cloud scroll flourishing outward from corner -->
  <path d="M 9 32 C 9 20 18 10 32 9" stroke="#f0d59e" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
  <path d="M 14 26 C 14 17 20 14 26 14 C 29 14 31 16 31 18 C 31 21 28 23 25 23 C 21 23 18 20 18 16" stroke="#f0d59e" stroke-width="1.1" stroke-linecap="round" opacity="0.9" />
  <!-- Little jewel dot -->
  <circle cx="10" cy="10" r="1.5" fill="#fce5b2" opacity="0.95" />
</svg>
