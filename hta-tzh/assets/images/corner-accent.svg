<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer hairline corner aligned to frame border -->
  <path d="M 0 48 L 0 0 L 48 0" stroke="#e5c378" stroke-width="1.5" stroke-linecap="square" opacity="0.95" />
  <!-- Inner parallel accent hairline -->
  <path d="M 4 40 L 4 4 L 40 4" stroke="#e5c378" stroke-width="0.75" stroke-linecap="square" opacity="0.65" />
  <!-- Traditional Chinese Huiwen (回纹) Meander Fretwork -->
  <path d="M 8 32 L 8 8 L 32 8 L 32 24 L 16 24 L 16 16 L 24 16" stroke="#f0d59e" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter" opacity="0.9" />
  <!-- Auspicious accent diamond -->
  <polygon points="20,18.5 21.5,20 20,21.5 18.5,20" fill="#fce5b2" opacity="0.95" />
</svg>
